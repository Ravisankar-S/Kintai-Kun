databases:
  - name: kintai_kun_db
    databaseName: kintai_kun
    user: kintai_kun
    plan: free

services:
  - type: web
    name: kintai_kun_web
    env: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kintai_kun_db
          property: connectionString
      - key: CACHE_DATABASE_URL
        fromDatabase:
          name: kintai_kun_db
          property: connectionString
      - key: QUEUE_DATABASE_URL
        fromDatabase:
          name: kintai_kun_db
          property: connectionString
      - key: CABLE_DATABASE_URL
        fromDatabase:
          name: kintai_kun_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: KINTAI_KUN_DATABASE_PASSWORD
        fromDatabase:
          name: kintai_kun_db
          property: password
